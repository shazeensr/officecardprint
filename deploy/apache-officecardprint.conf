# Office Card Print — Apache vhost.
# Copy to /etc/apache2/sites-available/officecardprint.conf, then:
#   a2ensite officecardprint.conf && a2dissite 000-default.conf && systemctl reload apache2
#
# Replace ServerName once you have a domain; "_" matches any Host header,
# which is fine for a plain-IP / internal deployment.
<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/officecardprint

    <Directory /var/www/officecardprint>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Security headers (requires: a2enmod headers).
    # CSP allows 'unsafe-inline' for script/style because the app uses
    # inline onclick= handlers and inline <style> blocks throughout — a
    # strict nonce-based policy would need those rewritten first. Still
    # meaningfully restricts script/object/frame sources and blocks this
    # app from being framed by another site.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # The app root doubles as the web root, so anything not meant to be
    # served over HTTP has to be denied explicitly — most importantly
    # .env (DB + LDAP credentials) and .git (full source history).
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(sql|md|example)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "^/var/www/officecardprint/(\.git|lib|config|deploy)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/officecardprint-error.log
    CustomLog ${APACHE_LOG_DIR}/officecardprint-access.log combined
</VirtualHost>
