; Office Card Print — PHP hardening for the Apache module. Installed by
; deploy.sh / setup-server.sh into the apache2 conf.d directory.

; The app never shells out, so a bug that lets an attacker run PHP code
; can't also run commands.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

; No URL includes/fetches from PHP (HR lookup uses cURL, which is unaffected).
allow_url_fopen = Off
allow_url_include = Off

; Photos are read in the browser and posted as JSON; there are no file uploads.
file_uploads = Off

; Session cookie defaults (lib/session.php also sets these per request).
; The whole site is HTTPS-only now.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
